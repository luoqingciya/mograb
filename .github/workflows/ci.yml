# SPDX-License-Identifier: GPL-3.0-only
#
# MoGrab CI —— 对应规划书 §48。
#
# 阶段：lint → type-check → unit-test → integration-test → source-test
# 矩阵：Python 3.11/3.12 × Windows/Linux

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Lint + 格式 + 文档内链
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 文档里引用的文件必须真实存在。之前规划书被收进 docs/planning/ 时
      # 就留下一批悬空引用，靠人眼查不现实。
      - name: Check documentation links
        run: uv run python scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # 版本号来源
  # ---------------------------------------------------------------------------
  version:
    name: Version source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # 校验 VERSION 符合 PEP 440，三个包都用 dynamic version 指向同一个文件，
      # 且源码里没有第二处硬编码的 __version__
      - name: Check version source
        run: uv run python scripts/version.py check

      - name: Show version
        run: uv run python scripts/version.py show

  # ---------------------------------------------------------------------------
  # 类型检查
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Pyright
        run: uv run pyright

  # ---------------------------------------------------------------------------
  # 测试（矩阵）
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # 单元 + 集成 + 书源 fixture（全部离线；network 标记默认跳过）
      - name: Run tests
        run: uv run pytest -m "not network" --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 书源校验
  #
  # 书源本身不进仓库，这里只校验 tests/fixtures 下的示例书源 ——
  # 它是规范的参考实现，挂了说明规范或 linter 出了问题。
  # ---------------------------------------------------------------------------
  source-lint:
    name: Source lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Lint example source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          failed=0
          for f in tests/fixtures/**/source.yaml; do
            found=1
            echo "::group::lint $f"
            if ! uv run mog source lint "$f"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::没找到任何书源夹具，tests/fixtures 是不是被清掉了？"
            exit 1
          fi
          exit $failed

  # ---------------------------------------------------------------------------
  # 构建产物校验（确保包可安装）
  # ---------------------------------------------------------------------------
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheels
        run: uv build --all-packages --out-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面端（TypeScript 编译 + 类型检查 + SSE 解析器测试）
  #
  # 只装依赖不下载 Electron 二进制 —— 类型检查、tsc 编译和那 14 个测试
  # 都用不到它，省一次上百兆的下载。
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (tsc)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build
        working-directory: apps/desktop
        run: npm run build

      # 测的是编译产物（dist/renderer/sse.js），所以必须排在 Build 之后
      - name: Test
        working-directory: apps/desktop
        run: npm test
