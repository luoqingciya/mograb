#
# MoGrab CI —— Rust Cargo 工作区流水线。
#
# 阶段：lint (fmt + clippy + check_docs) → test (Ubuntu/Windows + fixtures) → build-smoke → desktop

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 格式 + Clippy + 文档内链
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation links
        run: python3 scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # 单元测试 / 集成测试 / 示例书源离线夹具
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Lint and test example sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          for f in tests/fixtures/**/source.yaml; do
            found=1
            echo "::group::lint $f"
            cargo run --locked --bin mog -- source lint "$f"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::未找到 tests/fixtures/**/source.yaml"
            exit 1
          fi

          tested=0
          for f in tests/fixtures/**/fixtures/cases.yaml; do
            tested=1
            dir="$(dirname "$(dirname "$f")")"
            echo "::group::source test $dir"
            cargo run --locked --bin mog -- source test "$dir"
            echo "::endgroup::"
          done
          if [ "$tested" -eq 0 ]; then
            echo "::error::未找到 tests/fixtures/**/fixtures/cases.yaml"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Release 二进制构建与端到端冒烟
  # ---------------------------------------------------------------------------
  build-smoke:
    name: Release Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Smoke test CLI & API binaries
        shell: bash
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          export MOGRAB_HOME="$tmp_home"

          target/release/mog --version
          target/release/mog init --json
          target/release/mog book --json
          target/release/mog find 关键词 --json

          MOGRAB_SERVER__HOST=127.0.0.1 MOGRAB_SERVER__PORT=48799 target/release/mograb-api &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -rf "$tmp_home"' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:48799/health > /dev/null; then
              break
            fi
            sleep 0.2
          done

          curl -sf http://127.0.0.1:48799/health
          code_unauth="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48799/api/v1/sources)"
          test "$code_unauth" = "401"

          token="$(cat "$tmp_home/token")"
          code_auth="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:48799/api/v1/sources)"
          test "$code_auth" = "200"

          kill "$api_pid" || true

  # ---------------------------------------------------------------------------
  # 桌面端（TypeScript 编译 + 类型检查 + SSE 解析器测试）
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (tsc)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build
        working-directory: apps/desktop
        run: npm run build

      - name: Test
        working-directory: apps/desktop
        run: npm test
