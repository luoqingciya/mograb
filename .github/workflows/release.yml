# SPDX-License-Identifier: GPL-3.0-only
#
# MoGrab Release —— 原生 Rust 二进制 + Electron Windows 打包流水线。
#
# 触发方式：
#   1. 推 v* tag（正式发版）
#   2. 手动触发（可以只建 draft 做预演）
#
# 流程：Verify → 三路并行构建（Win CLI / Win Desktop / Linux CLI）→ SHA256SUMS → GitHub Release

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀），必须与 VERSION 和 Cargo.toml 一致，例如 1.0.0-rc.8"
        required: true
        type: string
      draft:
        description: "只建 draft，不公开发布（预演用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 发布前质量门禁
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve and check version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RAW_VERSION#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"

          echo "本次发布版本   = $tag_version"
          echo "VERSION 文件   = $file_version"
          echo "Cargo.toml 版本 = $cargo_version"

          if [ "$tag_version" != "$file_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::版本不一致，请确保 Tag、VERSION 与 Cargo.toml 一致"
            exit 1
          fi

          if [[ "$tag_version" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check documentation links
        run: python3 scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # Windows CLI（单二进制 mog.exe + 许可证 → ZIP）
  # ---------------------------------------------------------------------------
  build-cli-windows:
    name: Build CLI (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build mog.exe
        run: cargo build --release --locked --bin mog

      - name: Smoke test mog.exe
        shell: bash
        run: target/release/mog.exe --version

      - name: Stage & Create ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $stage = "release-artifacts/MoGrab-CLI"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/mog.exe" "$stage/"
          Copy-Item "LICENSE" "$stage/"
          Copy-Item "THIRD_PARTY_LICENSES.md" "$stage/"
          Compress-Archive -Path $stage -DestinationPath "MoGrab-CLI-v$version-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: MoGrab-CLI-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows Desktop（原生后端 mograb-api.exe + Electron → ZIP + NSIS）
  # ---------------------------------------------------------------------------
  build-desktop-windows:
    name: Build Desktop (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build backend sidecar (mograb-api.exe)
        run: cargo build --release --locked --bin mograb-api

      - name: Stage backend sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts/backend" | Out-Null
          Copy-Item "target/release/mograb-api.exe" "release-artifacts/backend/"

      - name: Install Electron dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app (ZIP + NSIS)
        working-directory: apps/desktop
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          npm run build
          npx electron-builder --win --publish never --config.extraMetadata.version="$version"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux CLI（单二进制 mog + 许可证 → tar.gz）
  # ---------------------------------------------------------------------------
  build-cli-linux:
    name: Build CLI (Linux x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build mog
        run: cargo build --release --locked --bin mog

      - name: Smoke test mog
        run: ./target/release/mog --version

      - name: Stage & Create tar.gz
        run: |
          version="${{ needs.verify.outputs.version }}"
          stage="release-artifacts/MoGrab-CLI"
          mkdir -p "$stage"
          cp target/release/mog "$stage/"
          cp LICENSE THIRD_PARTY_LICENSES.md "$stage/"
          tar -czf "MoGrab-CLI-v${version}-linux-x64.tar.gz" -C release-artifacts MoGrab-CLI

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: MoGrab-CLI-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总产物 + 校验和 + 创建 Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [verify, build-cli-windows, build-desktop-windows, build-cli-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          python3 scripts/release.py notes --version "$VERSION" > release-notes.md
          echo "----- 发布说明（$(wc -l < release-notes.md) 行）-----"
          head -30 release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          prerelease: ${{ needs.verify.outputs.prerelease }}
          draft: ${{ inputs.draft == true }}
          generate_release_notes: false
