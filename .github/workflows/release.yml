# SPDX-License-Identifier: GPL-3.0-only
#
# MoGrab Release —— 原生 Rust 二进制 + Electron (Windows / Linux) 打包流水线。
#
# 触发方式：
#   1. 推 v* tag（正式发版）
#   2. 手动触发（可以只建 draft 做预演）
#
# 流程：Verify → 四路并行构建（Win CLI / Win Desktop / Linux CLI / Linux Desktop）→ SHA256SUMS → GitHub Release

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀），必须与 VERSION 和 Cargo.toml 一致，例如 1.0.0-rc.9"
        required: true
        type: string
      draft:
        description: "只建 draft，不公开发布（预演用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 发布前质量门禁
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve and check version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RAW_VERSION#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"

          echo "本次发布版本   = $tag_version"
          echo "VERSION 文件   = $file_version"
          echo "Cargo.toml 版本 = $cargo_version"

          if [ "$tag_version" != "$file_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::版本不一致，请确保 Tag、VERSION 与 Cargo.toml 一致"
            exit 1
          fi

          if [[ "$tag_version" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check documentation links
        run: python3 scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # Windows CLI（单二进制 mog.exe + 许可证 → ZIP）
  # ---------------------------------------------------------------------------
  build-cli-windows:
    name: Build CLI (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build mog.exe
        run: cargo build --release --locked --bin mog

      - name: Smoke test mog.exe
        shell: bash
        run: target/release/mog.exe --version

      - name: Stage & Create ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $stage = "release-artifacts/mograb-cli"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/mog.exe" "$stage/"
          Copy-Item "LICENSE" "$stage/"
          Copy-Item "THIRD_PARTY_LICENSES.md" "$stage/"
          Compress-Archive -Path $stage -DestinationPath "mograb-cli-v$version-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: mograb-cli-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows Desktop（Tauri v2 进程内嵌入后端 → 便携 ZIP + NSIS 安装包）
  # ---------------------------------------------------------------------------
  build-desktop-windows:
    name: Build Desktop (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          prefix-key: "v2-tauri-windows"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app (NSIS + standalone EXE)
        working-directory: apps/desktop
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          npx tauri build --bundles nsis --config "{\"version\":\"$version\"}"

      - name: Stage artifacts (setup EXE + portable ZIP)
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null

          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "未找到 NSIS 安装包产物" }
          Copy-Item $nsis.FullName "release-artifacts/mograb-desktop-v$version-windows-x64-setup.exe"

          $portable = "release-artifacts/mograb-desktop"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/mograb-desktop.exe" "$portable/"
          Copy-Item "LICENSE" "$portable/"
          Copy-Item "THIRD_PARTY_LICENSES.md" "$portable/"
          Compress-Archive -Path $portable -DestinationPath "release-artifacts/mograb-desktop-v$version-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            release-artifacts/mograb-desktop-*.zip
            release-artifacts/mograb-desktop-*-setup.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux CLI（单二进制 mog + 许可证 → tar.gz）
  # ---------------------------------------------------------------------------
  build-cli-linux:
    name: Build CLI (Linux x64)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-ubuntu-22.04"

      - name: Build mog
        run: cargo build --release --locked --bin mog

      - name: Smoke test mog
        run: ./target/release/mog --version

      - name: Stage & Create tar.gz
        run: |
          version="${{ needs.verify.outputs.version }}"
          stage="release-artifacts/mograb-cli"
          mkdir -p "$stage"
          cp target/release/mog "$stage/"
          cp LICENSE THIRD_PARTY_LICENSES.md "$stage/"
          tar -czf "mograb-cli-v${version}-linux-x64.tar.gz" -C release-artifacts mograb-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: mograb-cli-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux Desktop（Tauri v2 进程内嵌入后端 → DEB + RPM）
  # ---------------------------------------------------------------------------
  build-desktop-linux:
    name: Build Desktop (Linux x64)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          prefix-key: "v2-ubuntu-22.04-tauri"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri & RPM packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app (DEB + RPM)
        working-directory: apps/desktop
        run: |
          version="${{ needs.verify.outputs.version }}"
          npx tauri build --bundles deb,rpm --config "{\"version\":\"$version\"}"

      - name: Stage Linux packages
        run: |
          version="${{ needs.verify.outputs.version }}"
          mkdir -p release-artifacts
          deb_file="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)"
          rpm_file="$(find apps/desktop/src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' | head -n 1)"
          test -n "$deb_file"
          test -n "$rpm_file"
          cp "$deb_file" "release-artifacts/mograb-desktop-v${version}-linux-x64.deb"
          cp "$rpm_file" "release-artifacts/mograb-desktop-v${version}-linux-x64.rpm"
          ls -lh release-artifacts/*.deb release-artifacts/*.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release-artifacts/*.deb
            release-artifacts/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总产物 + 校验和 + 创建 Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [verify, build-cli-windows, build-desktop-windows, build-cli-linux, build-desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          LC_ALL=C sha256sum $(ls -1 | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          python3 scripts/release.py notes --version "$VERSION" > release-notes.md
          echo "----- 发布说明（$(wc -l < release-notes.md) 行）-----"
          head -30 release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
          prerelease: ${{ needs.verify.outputs.prerelease }}
          draft: ${{ inputs.draft == true }}
          generate_release_notes: false
