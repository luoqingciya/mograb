# SPDX-License-Identifier: GPL-3.0-only
#
# MoGrab Release —— 对应规划书 §57.6、§57.7。
#
# 触发方式：
#   1. 推 v* tag（正式发版）
#   2. 手动触发（预演，需要填版本号）
#
# 流程：Verify → 三路并行打包 → SHA256SUMS → GitHub Release（draft）
#
# 打包说明（§57.1、§57.2）：
#   - CLI 用 PyInstaller onedir，不追求单文件 EXE
#   - 最终产物不含 uv / Python / Node.js
#   - 桌面端在 apps/desktop 有 package-lock.json 之前会跳过

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀），必须与 VERSION 文件一致，例如 0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  # tag 触发时取 tag 名，手动触发时取输入；后面的步骤会去掉 v 前缀
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 发布前质量门禁
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # tag 名必须和 VERSION 文件一致，否则产物名和包内版本会对不上
      - name: Check version matches VERSION file
        shell: bash
        run: |
          version="${RAW_VERSION#v}"
          file_version="$(uv run python scripts/version.py show)"
          echo "本次发布版本 = $version"
          echo "VERSION 文件   = $file_version"
          if [ "$version" != "$file_version" ]; then
            echo "::error::版本不一致。先把 VERSION 改成 $version 并提交，再重新打 tag"
            exit 1
          fi

      - name: Check version source
        run: uv run python scripts/version.py check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -m "not network"

  # ---------------------------------------------------------------------------
  # Windows CLI（PyInstaller onedir → ZIP）
  # ---------------------------------------------------------------------------
  build-cli-windows:
    name: Build CLI (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages --group build

      - name: Build CLI
        shell: bash
        run: uv run python scripts/build.py cli --version "${RAW_VERSION#v}"

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = $env:RAW_VERSION -replace '^v', ''
          # 压缩 MoGrab-CLI 目录本身，这样解压出来顶层就是 MoGrab-CLI/
          Compress-Archive -Path "release-artifacts/MoGrab-CLI" `
                           -DestinationPath "MoGrab-CLI-v$version-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: MoGrab-CLI-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows Desktop（后端 sidecar + Electron → ZIP + NSIS）
  #
  # apps/desktop 目前只有占位骨架，没有 package-lock.json。
  # 检测到 lockfile 缺失就跳过，等桌面端真正做起来再自动生效。
  # ---------------------------------------------------------------------------
  build-desktop-windows:
    name: Build Desktop (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Electron lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f apps/desktop/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/desktop 没有 package-lock.json，跳过桌面端构建"
          fi

      - name: Install uv
        if: steps.lockfile.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.lockfile.outputs.ready == 'true'
        run: uv python install 3.12

      - name: Set up Node.js
        if: steps.lockfile.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Python dependencies
        if: steps.lockfile.outputs.ready == 'true'
        run: uv sync --locked --all-packages --group build

      - name: Build Desktop backend (sidecar)
        if: steps.lockfile.outputs.ready == 'true'
        shell: bash
        run: uv run python scripts/build.py backend --version "${RAW_VERSION#v}"

      - name: Install Electron dependencies
        if: steps.lockfile.outputs.ready == 'true'
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app (ZIP + NSIS)
        if: steps.lockfile.outputs.ready == 'true'
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        if: steps.lockfile.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux CLI（tar.gz）
  # ---------------------------------------------------------------------------
  build-cli-linux:
    name: Build CLI (Linux x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages --group build

      - name: Build CLI
        run: uv run python scripts/build.py cli --version "${RAW_VERSION#v}"

      - name: Create tar.gz
        run: |
          version="${RAW_VERSION#v}"
          tar -czf "MoGrab-CLI-v${version}-linux-x64.tar.gz" -C release-artifacts MoGrab-CLI

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: MoGrab-CLI-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总产物 + 校验和 + 创建 Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-cli-windows, build-desktop-windows, build-cli-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tag 触发时 RAW_VERSION 形如 v0.1.0，手动触发时是用户填的 0.1.0。
      # 统一在这里去掉 v 前缀，后面拼 tag 名和产物名都用这个值。
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          # 取 CHANGELOG 里对应版本的段落（## [x.y.z] 到下一个 ## 之间）
          awk -v ver="$version" '
            $0 ~ "^## \\[?" ver "\\]?" {flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release ${version}" > release-notes.md
          fi
          echo "----- 发布说明 -----"
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: false
