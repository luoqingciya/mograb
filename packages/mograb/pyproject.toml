# SPDX-License-Identifier: GPL-3.0-only
#
# mograb —— MoGrab 核心库（Source / Network / Task / Storage / Content / Export）
#
# 本包是唯一的业务实现所在。CLI 与 Desktop 不得复制此处的逻辑。

[project]
name = "mograb"
dynamic = ["version"]
description = "MoGrab core engine: declarative source DSL, download pipeline, storage and export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "MoGrab Contributors" }]
keywords = ["novel", "ebook", "scraper", "epub", "source-dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = [
    # --- 网络 ---
    "httpx>=0.27,<1.0",
    # --- 解析：lxml 同时覆盖 CSS(cssselect) 与 XPath，收敛为单一解析引擎 ---
    "lxml>=5.2",
    "cssselect>=1.2",
    "jsonpath-ng>=1.6",
    # --- 校验与配置 ---
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # --- 存储 ---
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # --- 日志 ---
    "structlog>=24.1",
]

[project.optional-dependencies]
# 性能增强：selectolax 作为可选加速解析器（默认不启用）
fast = ["selectolax>=0.3"]
# 开发期使用的假数据/时间控制
dev = ["faker>=25.0", "freezegun>=1.5"]

[project.urls]
Homepage = "https://github.com/luoqingciya/mograb"
Documentation = "https://github.com/luoqingciya/mograb/tree/main/docs"
Repository = "https://github.com/luoqingciya/mograb"
Issues = "https://github.com/luoqingciya/mograb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 版本号唯一来源：仓库根目录的 VERSION 文件。
# 三个包（mograb / mograb-cli / mograb-api）都用同一份文件，改一处即可全局生效。
# 格式遵循 PEP 440（如 0.1.0.dev0、0.1.0、0.2.0rc1）。
#
# 注意：构建 sdist 时版本会被固化进 PKG-INFO，因此从 sdist 重建 wheel
# 或直接安装 sdist 都不需要仓库根的 VERSION 文件（已实测）。
[tool.hatch.version]
source = "regex"
path = "../../VERSION"
pattern = "^(?P<version>\\S+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/mograb"]

[tool.hatch.build.targets.sdist]
include = ["src/mograb", "README.md"]
