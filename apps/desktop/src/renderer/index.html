<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      内容安全策略：脚本只允许本地文件，连接只允许本地 API。
      style 放行 unsafe-inline 是因为进度条宽度要用内联 style 设置 ——
      脚本没有放宽，仍是严格模式。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:48721"
    />
    <title>MoGrab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <nav id="sidebar" class="sidebar"></nav>
      <div class="main">
        <div id="notice" class="notice"></div>
        <main id="content" class="content"></main>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
