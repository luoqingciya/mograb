# SPDX-License-Identifier: GPL-3.0-only
#
# mograb-api —— MoGrab 本地 REST API Server
#
# 职责边界（规划书 §29、§61）：API 是正式产品接口，CLI 与 Desktop 都围绕它工作。

[project]
name = "mograb-api"
dynamic = ["version"]
description = "MoGrab local REST API server (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "MoGrab Contributors" }]

dependencies = [
    "mograb",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[tool.uv.sources]
mograb = { workspace = true }

[project.scripts]
mograb-api = "mograb_api.main:run"

[project.urls]
Homepage = "https://github.com/luoqingciya/mograb"
Repository = "https://github.com/luoqingciya/mograb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 版本号唯一来源：仓库根目录的 VERSION 文件（与 mograb / mograb-cli 共用）
[tool.hatch.version]
source = "regex"
path = "../../VERSION"
pattern = "^(?P<version>\\S+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/mograb_api"]
