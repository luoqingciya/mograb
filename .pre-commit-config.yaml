# MoGrab pre-commit 钩子配置
# 安装： uv run pre-commit install
# 全量运行： uv run pre-commit run --all-files
#
# 原则：钩子只做「快速、确定性」的检查；重型检查（完整测试、打包）留给 CI。
# 详见 docs/development/ci.md

default_language_version:
  python: python3.11

repos:
  # ---- 通用文件卫生 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ---- Ruff：lint + format ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---- 类型检查（仅核心包，速度可控）----
  - repo: local
    hooks:
      - id: pyright
        name: pyright (core packages)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        files: ^(packages/mograb|apps/(cli|api))/.*\.py$

  # ---- 书源 Schema 校验 ----
  - repo: local
    hooks:
      - id: source-lint
        name: mograb source lint (changed sources)
        entry: uv run mog source lint
        language: system
        files: ^sources/.*/source\.ya?ml$
