# MoGrab pre-commit 钩子配置
# 安装： pre-commit install
# 全量运行： pre-commit run --all-files
#
# 原则：钩子只做「快速、确定性」的检查；完整跨平台构建与打包留给 CI。
# 详见 docs/development/ci.md

repos:
  # ---- 通用文件卫生 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ---- Rust: fmt + clippy ----
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # ---- 书源 Schema 校验 ----
  # 书源不进仓库，这里只管本地 sources/ 与测试夹具
  - repo: local
    hooks:
      - id: source-lint
        name: mograb source lint
        entry: cargo run --quiet --bin mog -- source lint
        language: system
        files: ^(sources|tests/fixtures)/.*/source\.ya?ml$
